name: Setup Runner for JHipster Applications
description: Setup Runner for JHipster Applications
inputs:
  node-version:
    description: Node version to be installed.
  java-version:
    description: Java version to be installed.
  npm-version:
    description: npm version to be installed.
  npm-cache:
    description: Restore npm cache.
    default: true
  maven-cache:
    description: Restore maven cache.
    default: false
  gradle-cache:
    description: Restore gradle cache.
    default: false
  maven-mirror:
    description: >-
      URL of a mirror of Maven Central, which Maven and Gradle resolve the artifacts from before Maven Central and the
      other repositories of the build, the fallback for an artifact the mirror does not have yet. Empty to resolve from
      them only. Writes ~/.m2/settings.xml and the init script maven-central-mirror.gradle of the Gradle user home.
    default: https://maven-central.storage-download.googleapis.com/maven2/
  binary-dir:
    description: Path to the dir containing the executable
  remove-android:
    default: false
    description: Remove dotnet to free space
  remove-dotnet:
    default: false
    description: Remove dotnet to free space
  remove-java:
    default: false
    description: Remove java to free space
runs:
  using: composite
  steps:
    - uses: jhipster/actions/create-app-path@v2
    - uses: jhipster/actions/setup-keycloak-hostname@v2
    - uses: jhipster/actions/setup-git@v2
    - uses: actions/setup-node@v7
      if: inputs.node-version
      with:
        node-version: ${{ inputs.node-version }}
    - uses: actions/setup-java@v6
      if: inputs.java-version
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java-version }}
    # After actions/setup-java, which writes its own settings.xml.
    - name: 'Maven Central mirror'
      if: inputs.maven-mirror
      shell: bash
      env:
        MAVEN_MIRROR: ${{ inputs.maven-mirror }}
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml <<SETTINGS
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
          <profiles>
            <profile>
              <id>maven-central-mirror</id>
              <repositories>
                <repository>
                  <id>maven-central-mirror</id>
                  <url>${MAVEN_MIRROR}</url>
                  <snapshots><enabled>false</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>maven-central-mirror</id>
                  <url>${MAVEN_MIRROR}</url>
                  <snapshots><enabled>false</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>maven-central-mirror</activeProfile>
          </activeProfiles>
        </settings>
        SETTINGS
        # Gradle applies the scripts of init.d to every build, buildSrc included: the mirror comes first in the
        # repositories of the settings, of the plugins and of each project, which declares its own after it.
        GRADLE_INIT_DIR="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
        mkdir -p "$GRADLE_INIT_DIR"
        cat > "$GRADLE_INIT_DIR/maven-central-mirror.gradle" <<INIT
        def addMavenCentralMirror = { repositories ->
            repositories.maven {
                name = 'mavenCentralMirror'
                url = '${MAVEN_MIRROR}'
                mavenContent { releasesOnly() }
            }
        }
        beforeSettings { settings ->
            addMavenCentralMirror(settings.buildscript.repositories)
            addMavenCentralMirror(settings.pluginManagement.repositories)
            // A plugin repository replaces the Gradle Plugin Portal a build without plugin repositories resolves from.
            settings.pluginManagement.repositories.gradlePluginPortal()
        }
        beforeProject { project ->
            addMavenCentralMirror(project.buildscript.repositories)
            addMavenCentralMirror(project.repositories)
        }
        INIT
    - uses: jhipster/actions/restore-cache@v2
      with:
        npm: ${{ inputs.npm-cache }}
        maven: ${{ inputs.maven-cache }}
        gradle: ${{ inputs.gradle-cache }}
    - name: 'Install required NPM version'
      if: inputs.npm-version
      shell: bash
      run: npm install -g npm@${{ inputs.npm-version }} || true
    - run: echo "${{ inputs.binary-dir }}" >> $GITHUB_PATH
      shell: bash
      if: inputs.binary-dir
    - name: 'Remove Android'
      if: inputs.remove-android == 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo rm -rf /usr/local/lib/android
    - name: 'Remove .Net'
      if: inputs.remove-dotnet == 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo rm -rf /usr/share/dotnet
    - name: 'Remove Java'
      if: inputs.remove-java == 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo rm -rf /usr/lib/jvm
